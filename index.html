<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedTheme = localStorage.getItem('newsroom-theme');
        if (savedTheme === 'dark' || (savedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>html { background: #ffffff; } html.dark { background: #0A1A2C; }</style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Newsroom Daily | Gaming, Tech, Money, Career and Everyday Guides</title>
    <meta name="description" content="The Newsroom Daily brings clear, practical guides on GTA 6 gaming, tech how-to, money and finance, career and work, and everyday life." />
    <meta property="og:title" content="The Newsroom Daily" />
    <meta property="og:description" content="Clear, practical guides on gaming, tech, money, career and everyday life." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thenewsroomdaily.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
